name: cron-checker-agent
arch: amd64
platform: linux
version: 0.1.0
maintainer: cron-checker <noreply@example.com>
description: Cron checker agent — exposes local cron/systemd-timer state over HTTP
license: MIT
contents:
  - src: bin/cron-checker-agent-linux-amd64
    dst: /usr/bin/cron-checker-agent
  - src: deploy/cron-checker-agent.service
    dst: /etc/systemd/system/cron-checker-agent.service
  - src: deploy/agent.env.example
    dst: /etc/cron-checker/agent.env
    type: config|noreplace
overrides:
  rpm:
    depends:
      - systemd
  deb:
    depends:
      - systemd
scripts:
  postinstall: deploy/scripts/postinstall.sh
  preremove: deploy/scripts/preremove.sh
